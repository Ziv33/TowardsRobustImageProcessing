name: digitalImageProcessing
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Base Platform and Kernel Libraries
  - python=3.10
  - pip
  - ipykernel
  - jupyterlab
  - ipywidgets

  # Core Scientific Stack and Data Frameworks
  - numpy>=1.21
  - pandas
  - scikit-learn
  - scikit-image>=0.19

  # Image Processing and Computer Vision Libraries
  - opencv>=4.6
  - albumentations>=1.3

  # Deep Learning Core Frameworks (GPU/CUDA Support)
  - pytorch
  - torchvision
  - pytorch-cuda=11.8

  # Plotting, Metrics and Progress Utilities
  - matplotlib
  - seaborn
  - tqdm

  # Python Package Index Specific Frameworks
  - pip:
      - ultralytics>=8.0.0
      - pyyaml